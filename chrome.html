<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ego Windows</title>
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <div id="tabs"></div>
  <div id="toolbar">
    <button id="back" title="뒤로">←</button>
    <button id="forward" title="앞으로">→</button>
    <button id="reload" title="새로고침">↻</button>
    <form id="address-form"><input id="address" aria-label="주소 또는 검색" placeholder="주소 또는 검색" autocomplete="off"></form>
    <button id="new" title="새 탭">＋</button>
  </div>
  <script src="chrome.js"></script>
</body>
</html>
