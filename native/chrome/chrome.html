<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>pluck chrome</title>
<style>
:root {
  --canvas: #ecede7;
  --surface: #ffffff;
  --hover: rgba(29, 34, 31, .055);
  --press: rgba(29, 34, 31, .1);
  --ink: #1d221f;
  --ink-2: #48504a;
  --muted: #8a918b;
  --line: rgba(29, 34, 31, .09);
  --accent: #c8f060;
  --accent-ink: #1f2a00;
  --accent-strong: #6b9312;
  --ai: #7462ee;
  --ai-soft: rgba(116, 98, 238, .12);
  --scrim: rgba(236, 237, 231, .35);
  --shadow-card: 0 0 0 1px rgba(20, 26, 22, .07), 0 1px 2px rgba(20, 26, 22, .05), 0 12px 32px -14px rgba(20, 26, 22, .28);
  --shadow-pill: 0 0 0 1px rgba(20, 26, 22, .06), 0 1px 3px rgba(20, 26, 22, .08);
  --shadow-pop: 0 0 0 1px rgba(20, 26, 22, .08), 0 24px 64px -16px rgba(20, 26, 22, .35), 0 8px 20px -10px rgba(20, 26, 22, .2);
  --ease: cubic-bezier(.16, 1, .3, 1);
  --sidebar: 268px;
  --gap: 8px;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #131614;
    --surface: #1f2420;
    --hover: rgba(231, 236, 229, .06);
    --press: rgba(231, 236, 229, .11);
    --ink: #e7ece5;
    --ink-2: #b5bcb4;
    --muted: #7b837c;
    --line: rgba(231, 236, 229, .08);
    --accent-strong: #c8f060;
    --ai: #a596ff;
    --ai-soft: rgba(165, 150, 255, .15);
    --scrim: rgba(10, 12, 11, .35);
    --shadow-card: 0 0 0 1px rgba(255, 255, 255, .06), 0 12px 36px -12px rgba(0, 0, 0, .7);
    --shadow-pill: 0 0 0 1px rgba(255, 255, 255, .07), 0 1px 3px rgba(0, 0, 0, .4);
    --shadow-pop: 0 0 0 1px rgba(255, 255, 255, .08), 0 24px 64px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--canvas); color: var(--ink);
  font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
  user-select: none; -webkit-user-drag: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: -2px; }
svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#app { display: flex; height: 100%; }
#sidebar {
  width: var(--sidebar); flex: none; display: flex; flex-direction: column; min-height: 0;
  transition: width 200ms cubic-bezier(.2,.8,.2,1); overflow: hidden;
}
body.collapsed { --sidebar: 60px; }
#stage { flex: 1; min-width: 0; padding: var(--gap) var(--gap) var(--gap) 0; display: flex; }
#viewport { flex: 1; position: relative; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-card); }
#freeze-wrap { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
#freeze {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
  transition: filter 260ms var(--ease), transform 260ms var(--ease), opacity 160ms;
}
#freeze[src] { opacity: 1; }
#freeze:not([src]) { visibility:hidden; }
body.palette #freeze { filter: blur(14px) saturate(.85) brightness(.94); transform: scale(1.03); }
#freeze.swap { opacity: 0 !important; }
#sidebar-shot { position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;pointer-events:none; }
#sidebar-shot[hidden] { display:none; }
body.sidebar-instant #sidebar { transition:none; }

/* Progress line that hugs the top edge of the page card */
#progress {
  position: absolute; left: 14px; right: 14px; top: -5px; height: 2px; border-radius: 2px; overflow: hidden;
  opacity: 0; transition: opacity 300ms 150ms;
}
#progress i { position: absolute; inset: 0; border-radius: inherit; background: var(--accent-strong); transform-origin: left; transform: scaleX(0); }
#progress.run { opacity: 1; transition-delay: 0s; }
#progress.run i { animation: progress 6s cubic-bezier(.1, .7, .2, 1) forwards; }
#progress.done i { transform: scaleX(1); transition: transform 220ms var(--ease); }
@keyframes progress { 0% { transform: scaleX(0); } 100% { transform: scaleX(.9); } }

/* Top row */
.top { height: 48px; flex: none; display: flex; align-items: center; padding: 6px 14px 0; gap: 8px; }
.icon-btn {
  width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 8px; color: var(--ink-2);
  transition: background-color 120ms, color 120ms, transform 120ms var(--ease), opacity 200ms;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { background: var(--press); transform: scale(.92); }
.icon-btn:disabled { opacity: .32; background: none; transform: none; }
#toggle { width: 32px; }
.nav { flex:1; display:flex; gap:4px; transition:opacity 140ms; }
.nav #assistBtn { margin-left:auto; }
.fade { transition: opacity 180ms; }
body.collapsed .fade, body.collapsed .nav { opacity: 0; pointer-events: none; }

/* URL pill */
#urlbar {
  margin: 8px 10px 8px; height: 40px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  border-radius: 10px; background: var(--surface); box-shadow: var(--shadow-pill); text-align: left; overflow: hidden; position: relative;
  transition: background-color 120ms, box-shadow 160ms, transform 160ms var(--ease);
}
#urlbar:hover { box-shadow: var(--shadow-pill), 0 0 0 3px var(--hover); }
#urlbar:active { transform: scale(.985); }
#urlbar .ico { color: var(--muted); display: grid; }
#urlbar .ico.secure { color: var(--accent-strong); }
#urlbar .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; mask-image: linear-gradient(90deg, #000 82%, transparent); }
#urlbar .host { font-weight: 600; }
#urlbar .path { color: var(--muted); }
#urlbar .placeholder { color: var(--muted); }

/* New tab row */
#newtab {
  margin: 0 10px 10px; height: 38px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  border:1px solid color-mix(in srgb,var(--accent-strong) 12%,transparent);
  border-radius: 9px; background:color-mix(in srgb,var(--accent-strong) 7%,transparent); color: var(--ink-2); transition: background-color 120ms, transform 140ms var(--ease);
}
#newtab:hover { background: var(--hover); color: var(--ink); }
#newtab:active { background: var(--press); transform: scale(.985); }
#newtab span { flex: 1; text-align: left; white-space: nowrap; }
kbd {
  font: 600 10.5px/1 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--muted); padding: 4px 6px; border-radius: 5px;
  background: var(--hover); white-space: nowrap;
}

/* Tab list */
#tabs { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; padding-bottom: 12px; }
#tabs::-webkit-scrollbar { width: 6px; }
#tabs::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
#tabs:hover::-webkit-scrollbar-thumb { background: var(--line); }
#indicator {
  position: absolute; left: 10px; right: 10px; top: 0; height: 36px; border-radius: 8px; pointer-events: none;
  background: var(--surface); box-shadow: var(--shadow-pill); opacity: 0; will-change: transform;
  transition: opacity 180ms, background-color 200ms;
}
#indicator.glide { transition: transform 360ms var(--ease), height 360ms var(--ease), opacity 180ms, background-color 200ms; }
#indicator.ai { background: color-mix(in srgb, var(--surface) 88%, var(--ai)); }

.sec { position: relative; transition: opacity 260ms, height 300ms var(--ease); }
.sec.entering { opacity: 0; }
.sec.leaving { opacity: 0; overflow: hidden; }
.sec-head {
  height: 34px; margin: 6px 10px 0; padding: 0 8px 0 12px; display: flex; align-items: center; gap: 7px; width: calc(100% - 20px);
  color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .01em; border-radius: 8px; white-space: nowrap;
}
.sec-head .name { overflow: hidden; text-overflow: ellipsis; }
.sec-head .count { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
.sec-head .chev { display: grid; transition: transform 260ms var(--ease); opacity: .7; }
.sec-head .chev svg { width: 12px; height: 12px; stroke-width: 2.2; }
.sec.folded .chev { transform: rotate(-90deg); }
.sec[data-ai] .sec-head { color: var(--ai); }
.sec[data-ai] .sec-head:hover { background: var(--ai-soft); }
.sec-head .spark svg { width: 13px; height: 13px; }
.sec-head .pulse { display: none; }
.sec.busy .sec-head .pulse { display: block; }
body.collapsed .sec-head { opacity: 0; pointer-events: none; }
.sec::before {
  content: ""; position: absolute; left: 18px; right: 18px; top: 22px; height: 1px; background: var(--line);
  opacity: 0; transition: opacity 200ms;
}
body.collapsed .sec + .sec::before, body.collapsed .sec[data-ai]::before { opacity: 1; }
.sec-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 300ms var(--ease); }
.sec.folded .sec-body { grid-template-rows: 0fr; }
.sec-body > ul { min-height: 0; overflow: hidden; margin: 0; padding: 0; list-style: none; }

.tab {
  position: relative; height: 36px; margin: 0 10px 2px; padding: 0 5px 0 12px; display: flex; align-items: center; gap: 10px;
  border-radius: 8px; color: var(--ink-2); outline: none;
  transition: height 300ms var(--ease), margin 300ms var(--ease), opacity 220ms, transform 300ms var(--ease), background-color 120ms;
}
.tab:hover { background: var(--hover); }
.tab.active { color: var(--ink); background: transparent; }
.tab.entering { height: 0; margin-bottom: 0; opacity: 0; transform: translateX(-10px); }
.tab.leaving { height: 0; margin-bottom: 0; opacity: 0; transform: translateX(-6px) scale(.97); pointer-events: none; }
.tab.dragging { transition: height 300ms var(--ease), opacity 220ms, background-color 120ms; z-index: 3; background: var(--surface); box-shadow: var(--shadow-pop); color: var(--ink); }
.tab .title {
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; mask-image: linear-gradient(90deg, #000 84%, transparent);
  transition: opacity 180ms;
}
.tab.active .title { font-weight: 600; }
body.collapsed .tab .title, body.collapsed .tab .close, body.collapsed .tab .busy { opacity: 0; pointer-events: none; }
.close {
  width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 6px; color: var(--muted);
  opacity: 0; transition: opacity 120ms, background-color 120ms, color 120ms;
}
.close svg { width: 14px; height: 14px; }
.tab:hover .close, .tab.active .close { opacity: 1; }
.close:hover { background: var(--press); color: var(--ink); }

.fav { position: relative; width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.fav img { width: 16px; height: 16px; border-radius: 4px; transition: opacity 200ms, transform 300ms var(--ease); }
.fav img:not([src]), .fav img.broken { display: none; }
.fav .letter {
  width: 16px; height: 16px; border-radius: 5px; display: none; place-items: center; font-size: 10px; font-weight: 700;
  background: var(--press); color: var(--ink-2); transition: opacity 200ms;
}
.fav img:not([src]) + .letter, .fav img.broken + .letter { display: grid; }
.tab[data-agent] .fav .letter { background: var(--ai-soft); color: var(--ai); }
.fav .spin {
  position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent-strong);
  opacity: 0; transform: scale(.6); transition: opacity 200ms, transform 300ms var(--ease);
}
.tab[data-agent] .fav .spin { border-top-color: var(--ai); }
.tab.loading .fav .spin { opacity: 1; transform: scale(1); animation: spin 700ms linear infinite; }
.tab.loading .fav img, .tab.loading .fav .letter { opacity: 0; transform: scale(.5); }
@keyframes spin { to { transform: rotate(360deg); } }
.busy, .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ai); flex: none; position: relative; }
.busy { display: none; margin-right: 4px; }
.tab.is-busy .busy { display: block; }
.tab.is-busy .close { display: none; }
.busy::after, .pulse::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 1.4s var(--ease) infinite;
}
@keyframes ping { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.8); opacity: 0; } }

/* Footer */
#footer { flex:none; padding:8px 10px; border-top:1px solid var(--line); }
#tabSearch { display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;border-radius:8px;color:var(--muted);white-space:nowrap; }
#tabSearch:hover { background:var(--hover);color:var(--ink); }
#tabSearch span { flex:1;text-align:left; }

/* Command palette */
#palette { position: fixed; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: flex-start; padding-top: 13vh; }
#palette[hidden] { display: none; }
#palette .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 220ms; }
#palette.in .scrim { opacity: 1; }
#palette .panel {
  position: relative; width: min(640px, calc(100vw - 48px)); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-pop);
  overflow: hidden; opacity: 0; transform: translateY(-8px) scale(.975); transform-origin: 50% 0;
  transition: opacity 160ms, transform 260ms var(--ease);
}
#palette.in .panel { opacity: 1; transform: none; }
#palette .field { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 16px 0 20px; }
#palette .field svg { width: 18px; height: 18px; color: var(--muted); }
#palette input {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink);
  font: 400 17px "Segoe UI Variable Display", "Segoe UI", "Malgun Gothic", sans-serif; user-select: text;
}
#palette input::placeholder { color: var(--muted); }
#palette input::selection { background: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--accent-ink); }
#palette .mode { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
#results { list-style: none; margin: 0; padding: 6px; border-top: 1px solid var(--line); max-height: 52vh; overflow-y: auto; }
#results:empty { display: none; }
#results li {
  display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 9px; color: var(--ink-2);
  opacity: 0; transform: translateY(4px); animation: rise 260ms var(--ease) forwards;
}
#results li.sel { background: var(--hover); color: var(--ink); }
#results li .ri { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--hover); flex: none; color: var(--muted); }
#results li.sel .ri { background: var(--accent); color: var(--accent-ink); }
#results li .ri img { width: 16px; height: 16px; border-radius: 4px; }
#results li .ri img + svg, #results li .ri img.broken { display: none; }
#results li .ri img.broken + svg { display: block; }
#results li.sel .ri:has(img) { background: var(--surface); box-shadow: var(--shadow-pill); }
#results li .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#results li .rt b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
#results li .rt span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#results li .hint { font-size: 11.5px; color: var(--muted); opacity: 0; transition: opacity 120ms; white-space: nowrap; }
#results li.sel .hint { opacity: 1; }
@keyframes rise { to { opacity: 1; transform: none; } }

/* AI panel */
:root { --assist: 0px; --claude: #d97757; --codex: #3f6ff0; }
@media (prefers-color-scheme: dark) { :root { --codex: #7f9cff; } }
body.assist { --assist: 400px; }
#assist { width: var(--assist); flex: none; overflow: hidden; transition: width 380ms var(--ease); padding: var(--gap) 0; }
#assist .card {
  width: 392px; height: 100%; display: flex; flex-direction: column; border-radius: var(--radius); background: var(--surface);
  box-shadow: var(--shadow-card); overflow: hidden; opacity: 0; transform: translateX(16px);
  transition: opacity 240ms, transform 380ms var(--ease);
}
body.assist #assist .card { opacity: 1; transform: none; }
#assistBtn.on { background: var(--hover); color: var(--ink); }
#assistBtn svg { color: var(--claude); }
.ahead { height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; border-bottom: 1px solid var(--line); }
.seg { position: relative; display: flex; padding: 3px; border-radius: 9px; background: var(--hover); }
.seg button { position: relative; z-index: 1; height: 28px; padding: 0 12px; border-radius: 7px; font-weight: 600; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; transition: color 160ms; }
.seg button.on { color: var(--ink); }
.seg button .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .35; transition: opacity 160ms; }
.seg button.on .dot { opacity: 1; }
.seg button[data-engine="claude"] .dot { background: var(--claude); }
.seg button[data-engine="codex"] .dot { background: var(--codex); }
.seg button.running .dot { animation: breathe 1.1s ease-in-out infinite; opacity: 1; }
@keyframes breathe { 50% { transform: scale(1.5); } }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 7px; background: var(--surface); box-shadow: var(--shadow-pill); transition: transform 320ms var(--ease), width 320ms var(--ease); }
.ahead .grow { flex: 1; }
.usage { flex: none; display: flex; gap: 14px; padding: 7px 16px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); }
.usage[hidden] { display: none; }
.usage span { display: flex; align-items: center; gap: 6px; }
.usage i { width: 46px; height: 4px; border-radius: 2px; background: var(--hover); position: relative; overflow: hidden; }
.usage i b { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent-strong); transition: width 400ms var(--ease); }
.usage i b.hot { background: var(--claude); }

.logs { flex: 1; min-height: 0; position: relative; }
.log { position: absolute; inset: 0; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px; user-select: text; }
.log[hidden] { display: none; }
.log::-webkit-scrollbar { width: 6px; }
.log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.log > * { animation: rise 280ms var(--ease) both; }
.empty { margin: auto 0; text-align: center; padding: 8px 8px 24px; user-select: none; }
.empty .mark { width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 19px; }
.empty .mark svg { width: 22px; height: 22px; }
.empty h3 { margin: 0 0 6px; font-size: 15px; }
.empty p { margin: 0 auto 18px; color: var(--muted); max-width: 290px; line-height: 1.5; }
.empty .sugs { display: flex; flex-direction: column; gap: 6px; }
.empty .sugs button {
  text-align: left; padding: 10px 12px; border-radius: 10px; background: var(--hover); color: var(--ink-2);
  transition: background-color 120ms, transform 140ms var(--ease);
}
.empty .sugs button:hover { background: var(--press); color: var(--ink); }
.empty .sugs button:active { transform: scale(.98); }
.empty code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.msg { line-height: 1.6; color: var(--ink); overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; max-width: 86%; background: var(--hover); padding: 9px 13px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
.msg.me .ctx-ref { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.ai p { margin: 0 0 8px; } .msg.ai p:last-child { margin-bottom: 0; }
.msg.ai h4 { margin: 12px 0 6px; font-size: 13.5px; }
.msg.ai ul, .msg.ai ol { margin: 4px 0 8px; padding-left: 20px; }
.msg.ai li { margin: 2px 0; }
.msg.ai a { color: var(--codex); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--codex) 35%, transparent); cursor: pointer; }
.msg.ai code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.msg.ai pre { margin: 6px 0 10px; padding: 10px 12px; border-radius: 8px; background: var(--hover); overflow-x: auto; }
.msg.ai pre code { background: none; padding: 0; }
.msg.ai.streaming > :last-child::after { content: ""; display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; border-radius: 2px; background: var(--ink-2); animation: caret 1s steps(2) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.tool { border-radius: 9px; border: 1px solid var(--line); font-size: 12px; overflow: hidden; }
.tool .row { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; cursor: default; }
.tool .row:hover { background: var(--hover); }
.tool .ti { color: var(--muted); display: grid; }
.tool .ti svg { width: 14px; height: 14px; }
.tool .tl { font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tool .td { flex: 1; min-width: 0; color: var(--muted); font-family: "Cascadia Mono", Consolas, monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .ts { width: 14px; height: 14px; flex: none; display: grid; place-items: center; }
.tool.run .ts { border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink-2); animation: spin 700ms linear infinite; }
.tool.ok .ts { color: var(--accent-strong); } .tool.fail .ts { color: #d4453a; }
.tool .ts svg { width: 14px; height: 14px; stroke-width: 2.4; }
.tool pre { margin: 0; padding: 8px 10px; max-height: 220px; overflow: auto; border-top: 1px solid var(--line); font: 11px/1.5 "Cascadia Mono", Consolas, monospace; color: var(--ink-2); white-space: pre-wrap; word-break: break-all; }
.tool pre[hidden] { display: none; }
.tool.browser { border-color: color-mix(in srgb, var(--ai) 30%, transparent); }
.tool.browser .ti { color: var(--ai); }
.think { font-size: 12px; color: var(--muted); font-style: italic; border-left: 2px solid var(--line); padding-left: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note { font-size: 12px; color: var(--muted); background: var(--hover); padding: 7px 10px; border-radius: 8px; white-space: pre-wrap; }
.note.err { color: #c2412f; background: color-mix(in srgb, #d4453a 10%, transparent); }
.typing { display: flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
.composer { flex: none; margin: 8px 10px 10px; border-radius: 12px; background: var(--canvas); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 160ms; }
.composer:focus-within { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 30%, transparent); }
.composer textarea {
  display: block; width: 100%; resize: none; border: 0; outline: 0; background: none; color: var(--ink); max-height: 160px;
  font: 13.5px/1.5 "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif; padding: 11px 13px 4px; user-select: text;
}
.composer textarea::placeholder { color: var(--muted); }
.composer .bar { display: flex; align-items: center; gap: 6px; padding: 4px 6px 6px 8px; }
.ctx { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 250px; height: 26px; padding: 0 9px; border-radius: 7px; font-size: 11.5px; color: var(--muted); transition: background-color 120ms, color 120ms; }
.ctx:hover { background: var(--hover); }
.ctx svg { width: 13px; height: 13px; flex: none; }
.ctx span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx.on { color: var(--ink-2); background: var(--surface); box-shadow: var(--shadow-pill); }
.ctx:not(.on) span { text-decoration: line-through; }
.send { margin-left: auto; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--ink); color: var(--surface); transition: transform 140ms var(--ease), opacity 160ms, background-color 160ms; }
.send:disabled { opacity: .25; }
.send:not(:disabled):active { transform: scale(.9); }
.send.stop { background: #d4453a; color: #fff; }
.send svg { width: 15px; height: 15px; stroke-width: 2.2; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
</style>

<script>
const $ = selector => document.querySelector(selector);
const webview = window.chrome?.webview;
const send = (type, data = {}) => webview?.postMessage({ type, ...data });
const nextFrame = fn => requestAnimationFrame(() => requestAnimationFrame(fn));
const icon = name => `<svg><use href="#i-${name}"/></svg>`;
const HOME = 'https://www.google.com/';

let state = { tabs: [], active: null, canBack: false, canForward: false, url: '', loading: false, collapsed: false };
let firstRender = true;
const sections = new Map();
const tabEls = new Map();
const folded = new Set();
const sectionsEl = $('#sections');
const tabsEl = $('#tabs');
const indicator = $('#indicator');

function parseUrl(value) {
  try {
    const url = new URL(value);
    if (!/^https?:$/.test(url.protocol)) return null;
    const path = url.pathname === '/' && !url.search ? '' : url.pathname + url.search;
    return { host: url.hostname.replace(/^www\./, ''), path, secure: url.protocol === 'https:' };
  } catch { return null; }
}
const escapeHtml = text => String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const tabTitle = tab => tab.title || parseUrl(tab.url)?.host || '새 탭';

/* ---------- Sidebar rendering ---------- */

function makeSection(key) {
  const el = document.createElement('section');
  el.className = 'sec';
  el.dataset.key = key;
  if (key !== 'user') el.dataset.ai = '';
  el.innerHTML = key === 'user'
    ? `<div class="sec-head"><span class="name">열린 탭</span><span class="count"></span></div>`
    : `<button class="sec-head" title="접기 / 펼치기"><span class="chev">${icon('chev')}</span><span class="spark">${icon('spark')}</span>`
      + `<span class="name"></span><span class="pulse"></span><span class="count"></span></button>`;
  el.insertAdjacentHTML('beforeend', '<div class="sec-body"><ul></ul></div>');
  if (key !== 'user') {
    el.querySelector('.name').textContent = key;
    el.querySelector('.sec-head').addEventListener('click', () => {
      folded.has(key) ? folded.delete(key) : folded.add(key);
      el.classList.toggle('folded', folded.has(key));
      track(400);
    });
  }
  return { el, list: el.querySelector('ul') };
}

function makeTab(tab) {
  const li = document.createElement('li');
  li.className = 'tab';
  li.tabIndex = -1;
  li.dataset.id = tab.id;
  li.innerHTML = `<span class="fav"><img alt=""><span class="letter"></span><span class="spin"></span></span>`
    + `<span class="title"></span><span class="busy" title="AI가 작업 중"></span>`
    + `<button class="close" title="탭 닫기 (Ctrl+W)">${icon('x')}</button>`;
  const img = li.querySelector('img');
  img.addEventListener('error', () => img.classList.add('broken'));
  img.addEventListener('load', () => img.classList.remove('broken'));
  li.querySelector('.close').addEventListener('click', event => { event.stopPropagation(); send('close', { id: tab.id }); });
  li.addEventListener('auxclick', event => { if (event.button === 1) send('close', { id: tab.id }); });
  li.addEventListener('pointerdown', event => startDrag(event, li, tab.id));
  return li;
}

function updateTab(li, tab) {
  const title = tabTitle(tab);
  li.querySelector('.title').textContent = title;
  li.querySelector('.letter').textContent = (parseUrl(tab.url)?.host || title).slice(0, 1).toUpperCase() || 'E';
  li.title = `${title}\n${tab.url}`;
  const img = li.querySelector('img');
  if (tab.favicon && img.getAttribute('src') !== tab.favicon) { img.classList.remove('broken'); img.src = tab.favicon; }
  if (!tab.favicon) img.removeAttribute('src');
  li.classList.toggle('active', tab.id === state.active);
  li.classList.toggle('loading', tab.loading);
  li.classList.toggle('is-busy', tab.busy);
  li.toggleAttribute('data-agent', tab.agent);
}

function enter(el, delay = 0) {
  el.classList.add('entering');
  if (delay) el.style.transitionDelay = `${delay}ms`;
  nextFrame(() => {
    el.classList.remove('entering');
    if (delay) setTimeout(() => { el.style.transitionDelay = ''; }, delay + 320);
  });
}

function leave(el) {
  if (el.classList.contains('sec')) el.style.height = `${el.offsetHeight}px`;
  el.getBoundingClientRect();
  el.classList.add('leaving');
  if (el.classList.contains('sec')) el.style.height = '0px';
  setTimeout(() => el.remove(), 340);
}

function render() {
  const groups = [];
  for (const tab of state.tabs) {
    if (groups.at(-1)?.key !== tab.space) groups.push({ key: tab.space, tabs: [] });
    groups.at(-1).tabs.push(tab);
  }
  const seenSections = new Set();
  const seenTabs = new Set();
  let previous = null;
  let stagger = 0;
  for (const group of groups) {
    seenSections.add(group.key);
    let section = sections.get(group.key);
    if (!section) {
      section = makeSection(group.key);
      sections.set(group.key, section);
      if (!firstRender) enter(section.el);
    }
    const anchor = previous ? previous.el.nextSibling : sectionsEl.firstChild;
    if (section.el !== anchor) sectionsEl.insertBefore(section.el, anchor);
    section.el.querySelector('.count').textContent = group.tabs.length;
    section.el.classList.toggle('busy', group.tabs.some(tab => tab.busy));
    section.el.classList.toggle('folded', folded.has(group.key));
    const dragging = drag?.started && drag.li.parentElement === section.list;
    let previousTab = null;
    for (const tab of group.tabs) {
      seenTabs.add(tab.id);
      let li = tabEls.get(tab.id);
      if (!li) {
        li = makeTab(tab);
        tabEls.set(tab.id, li);
        enter(li, firstRender ? stagger++ * 30 : 0);
      }
      if (!dragging || !li.isConnected) {
        const ref = previousTab ? previousTab.nextSibling : section.list.firstChild;
        if (li !== ref) section.list.insertBefore(li, ref);
      }
      updateTab(li, tab);
      previousTab = li;
    }
    previous = section;
  }
  for (const [id, li] of tabEls) if (!seenTabs.has(id)) { tabEls.delete(id); leave(li); }
  for (const [key, section] of sections) if (!seenSections.has(key)) { sections.delete(key); leave(section.el); }

  renderChrome();
  firstRender = false;
  const layoutKey = JSON.stringify([state.active, state.collapsed, state.tabs.map(t => [t.id, t.space])]);
  if (render.layoutKey !== layoutKey) { render.layoutKey = layoutKey; track(220); }
}

function renderChrome() {
  document.body.classList.toggle('collapsed', state.collapsed);
  $('#back').disabled = !state.canBack;
  $('#forward').disabled = !state.canForward;
  const url = parseUrl(state.url);
  const bar = $('#urlbar');
  bar.querySelector('.ico').className = `ico${url?.secure ? ' secure' : ''}`;
  bar.querySelector('.ico').innerHTML = icon(url ? (url.secure ? 'lock' : 'globe') : 'search');
  bar.querySelector('.text').innerHTML = url
    ? `<span class="host">${escapeHtml(url.host)}</span><span class="path">${escapeHtml(url.path)}</span>`
    : '<span class="placeholder">검색어 또는 주소 입력</span>';
  bar.title = url ? `${state.url}\n클릭하여 편집 (Ctrl+L)` : '주소 또는 검색 (Ctrl+L)';
  const progress = $('#progress');
  if (state.loading) {
    progress.classList.remove('done');
    if (!progress.classList.contains('run') || progress.dataset.for !== String(state.active)) {
      progress.classList.remove('run');
      progress.getBoundingClientRect();
      progress.classList.add('run');
      progress.dataset.for = state.active;
    }
  } else if (progress.classList.contains('run')) {
    const bar = progress.querySelector('i');
    bar.style.transform = getComputedStyle(bar).transform;
    progress.classList.remove('run');
    progress.classList.add('done');
    requestAnimationFrame(() => { bar.style.transform = ''; });
  }
  renderContext();
}

/* ---------- Active indicator ---------- */

let trackUntil = 0;
let tracking = false;
let lastActive = null;
let lastIndicator = '';
function track(ms) {
  trackUntil = Math.max(trackUntil, performance.now() + ms);
  if (!tracking) { tracking = true; requestAnimationFrame(step); }
}
function step() {
  placeIndicator();
  if (performance.now() < trackUntil || drag?.started) requestAnimationFrame(step);
  else tracking = false;
}
function placeIndicator() {
  const li = tabEls.get(state.active);
  const section = li?.closest('.sec');
  if (!li || !li.isConnected || section?.classList.contains('folded')) { indicator.style.opacity = 0; return; }
  if (lastActive !== state.active) {
    const wasVisible = indicator.style.opacity === '1';
    indicator.classList.toggle('glide', wasVisible);
    clearTimeout(placeIndicator.timer);
    placeIndicator.timer = setTimeout(() => indicator.classList.remove('glide'), 380);
    lastActive = state.active;
  }
  const top = li.getBoundingClientRect().top - tabsEl.getBoundingClientRect().top + tabsEl.scrollTop;
  const key = `${top.toFixed(1)}:${li.offsetHeight}`;
  if (key !== lastIndicator) {
    indicator.style.transform = `translateY(${top}px)`;
    indicator.style.height = `${Math.max(li.offsetHeight, 1)}px`;
    lastIndicator = key;
  }
  indicator.classList.toggle('ai', li.hasAttribute('data-agent'));
  indicator.style.opacity = li.classList.contains('dragging') ? 0 : 1;
  if (performance.now() > trackUntil - 300) li.scrollIntoView({ block: 'nearest' });
}

/* ---------- Drag to reorder ---------- */

let drag = null;
function startDrag(event, li, id) {
  if (event.button !== 0 || event.target.closest('.close')) return;
  drag = { li, id, startY: event.clientY, started: false, origin: 0 };
  li.setPointerCapture(event.pointerId);
}
function flip(elements, mutate) {
  const before = new Map(elements.map(el => [el, el.getBoundingClientRect().top]));
  mutate();
  for (const el of elements) {
    const delta = before.get(el) - el.getBoundingClientRect().top;
    if (!delta) continue;
    el.animate([{ transform: `translateY(${delta}px)` }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.16,1,.3,1)' });
  }
}
document.addEventListener('pointermove', event => {
  if (!drag) return;
  const { li } = drag;
  if (!drag.started) {
    if (Math.abs(event.clientY - drag.startY) < 5) return;
    drag.started = true;
    drag.origin = li.offsetTop;
    li.classList.add('dragging');
    track(0);
  }
  const list = li.parentElement;
  const siblings = [...list.children].filter(el => el !== li && !el.classList.contains('leaving'));
  const next = siblings.find(el => { const r = el.getBoundingClientRect(); return event.clientY < r.top + r.height / 2; }) ?? null;
  if (li.nextElementSibling !== next || (next === null && list.lastElementChild !== li)) {
    if (!(next === null && list.lastElementChild === li)) flip(siblings, () => list.insertBefore(li, next));
  }
  li.style.transform = `translateY(${event.clientY - drag.startY - (li.offsetTop - drag.origin)}px) scale(1.02)`;
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const { li, id, started } = drag;
  drag = null;
  if (!started) {
    state.active = id;
    for (const [tabId, el] of tabEls) el.classList.toggle('active', tabId === id);
    track(420);
    send('select', { id });
    return;
  }
  const from = li.style.transform;
  li.style.transform = '';
  li.classList.remove('dragging');
  li.animate([{ transform: from }, { transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.16,1,.3,1)' });
  track(420);
  const ids = [...li.parentElement.children].filter(el => !el.classList.contains('leaving')).map(el => Number(el.dataset.id));
  send('reorder', { ids });
});
document.addEventListener('pointercancel', () => {
  if (!drag) return;
  drag.li.style.transform = '';
  drag.li.classList.remove('dragging');
  drag = null;
});

/* ---------- Command palette ---------- */

const palette = $('#palette');
const query = $('#query');
const resultsEl = $('#results');
const freeze = $('#freeze');
let pal = { open: false, mode: 'new', items: [], sel: 0 };

const looksLikeUrl = text => !/\s/.test(text)
  && /^(https?:\/\/)?(localhost|\d{1,3}(\.\d{1,3}){3}|[\w-]+(\.[\w-]+)*\.[a-z]{2,})(:\d+)?([/?#].*)?$/i.test(text);

function buildResults() {
  const text = query.value.trim();
  const lower = text.toLowerCase();
  const target = pal.mode === 'new' ? '새 탭' : '현재 탭';
  const items = [];
  if (text && pal.mode !== 'tabs') {
    if (looksLikeUrl(text) || /^https?:\/\//i.test(text))
      items.push({ kind: 'open', icon: 'globe', title: text.replace(/^https?:\/\//i, ''), sub: `${target}에서 열기`, url: text, hint: 'Enter' });
    items.push({ kind: 'open', icon: 'search', title: text, sub: `Google 검색 · ${target}`, url: `https://www.google.com/search?q=${encodeURIComponent(text)}`, hint: 'Enter' });
  }
  const tabs = state.tabs.filter(tab => tab.id !== state.active || pal.mode !== 'current')
    .filter(tab => !lower || tabTitle(tab).toLowerCase().includes(lower) || tab.url.toLowerCase().includes(lower));
  const isPrefilled = pal.mode === 'current' && text === pal.url;
  for (const tab of (isPrefilled ? [] : tabs).slice(0, pal.mode === 'tabs' ? 100 : 6))
    items.push({ kind: 'tab', favicon: tab.favicon, icon: 'tab', title: tabTitle(tab), sub: (tab.agent ? `AI · ${tab.space} · ` : '') + (parseUrl(tab.url)?.host ?? tab.url), id: tab.id, hint: '탭으로 전환' });
  if (!text && pal.mode === 'new')
    items.unshift({ kind: 'open', icon: 'plus', title: '빈 새 탭', sub: 'google.com', url: HOME, hint: 'Enter' });
  pal.items = items;
  pal.sel = 0;
  resultsEl.innerHTML = items.map((item, index) => `<li data-index="${index}" style="animation-delay:${Math.min(index, 6) * 18}ms">`
    + `<span class="ri">${item.favicon ? `<img src="${escapeHtml(item.favicon)}" alt="">` : ''}${icon(item.icon)}</span>`
    + `<span class="rt"><b>${escapeHtml(item.title)}</b><span>${escapeHtml(item.sub)}</span></span><span class="hint">${item.hint}</span></li>`).join('');
  highlight();
}
function highlight() {
  [...resultsEl.children].forEach((li, index) => li.classList.toggle('sel', index === pal.sel));
  resultsEl.children[pal.sel]?.scrollIntoView({ block: 'nearest' });
}
function run(item) {
  if (!item) return;
  if (item.kind === 'tab') {
    if (item.id !== state.active) freeze.classList.add('swap');
    send('select', { id: item.id });
  } else {
    if (pal.mode === 'new') freeze.classList.add('swap');
    send('open', { url: item.url, newTab: pal.mode === 'new' });
  }

}
function openPalette(message) {
  pal.mode = ['current', 'tabs'].includes(message.mode) ? message.mode : 'new';
  pal.url = pal.mode === 'current' ? message.url || '' : '';
  query.value = pal.url;
  palette.querySelector('.mode').textContent = pal.mode === 'tabs' ? '열린 탭 검색' : pal.mode === 'new' ? '새 탭' : '현재 탭';
  query.placeholder = pal.mode === 'tabs' ? '탭 제목 또는 사이트로 검색' : '검색어 또는 주소 입력';
  buildResults();
  const focus = () => { query.focus(); query.select(); };
  if (pal.open) { focus(); return; }
  pal.open = true;
  freeze.classList.remove('swap');
  const show = () => {
    palette.hidden = false;
    document.body.classList.add('palette');
    send('frozen');
    nextFrame(() => palette.classList.add('in'));
    focus();
  };
  if (message.shot) { freeze.src = message.shot; freeze.decode().then(show, show); }
  else { freeze.removeAttribute('src'); show(); }
}
function closePalette() {
  if (!pal.open) return;
  pal.open = false;
  palette.classList.remove('in');
  document.body.classList.remove('palette');
  setTimeout(() => {
    if (pal.open) return;
    palette.hidden = true;
    send('thaw');
    setTimeout(() => { if (!pal.open) { freeze.removeAttribute('src'); freeze.classList.remove('swap'); } }, 150);
  }, 220);
}
resultsEl.addEventListener('error', event => event.target.classList?.add('broken'), true);
query.addEventListener('input', buildResults);
query.addEventListener('keydown', event => {
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    const count = pal.items.length;
    if (count) pal.sel = (pal.sel + (event.key === 'ArrowDown' ? 1 : count - 1)) % count;
    highlight();
  } else if (event.key === 'Enter') { event.preventDefault(); run(pal.items[pal.sel]); }
  else if (event.key === 'Escape') { event.preventDefault(); closePalette(); }
});
resultsEl.addEventListener('pointermove', event => {
  const li = event.target.closest('li');
  if (li && Number(li.dataset.index) !== pal.sel) { pal.sel = Number(li.dataset.index); highlight(); }
});
resultsEl.addEventListener('click', event => { const li = event.target.closest('li'); if (li) run(pal.items[Number(li.dataset.index)]); });
palette.querySelector('.scrim').addEventListener('pointerdown', closePalette);
window.addEventListener('blur', () => { if (pal.open) setTimeout(() => { if (!document.hasFocus()) closePalette(); }, 0); });

/* ---------- AI panel ---------- */

const ENGINES = {
  claude: { label: 'Claude', color: 'var(--claude)' },
  codex: { label: 'Codex', color: 'var(--codex)' },
};
const SUGGESTIONS = [
  '이 페이지 핵심만 3줄로 요약해줘',
  '이 페이지에서 중요한 링크만 골라 정리해줘',
  '새 탭에서 오늘 주요 IT 뉴스 찾아서 정리해줘',
];
const ai = {
  engine: 'claude',
  context: true,
  status: { claude: { available: true, running: false }, codex: { available: true, running: false } },
  streaming: { claude: null, codex: null },
  tools: { claude: new Map(), codex: new Map() },
  usage: null,
  history: {},
};
const aiInput = $('#aiInput');
const aiSend = $('#aiSend');
const logOf = engine => document.querySelector(`.log[data-engine="${engine}"]`);

function inlineMd(text) {
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2">$2</a>');
}
function markdown(source) {
  return source.split('```').map((part, index) => {
    if (index % 2) return `<pre><code>${escapeHtml(part.replace(/^[\w-]*\n/, '').replace(/\n$/, ''))}</code></pre>`;
    const out = [];
    let list = null;
    let para = [];
    const flush = () => { if (para.length) { out.push(`<p>${para.map(inlineMd).join('<br>')}</p>`); para = []; } };
    const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (const line of part.split('\n')) {
      let match;
      if (!line.trim()) { flush(); endList(); }
      else if ((match = line.match(/^#{1,6}\s+(.*)/))) { flush(); endList(); out.push(`<h4>${inlineMd(match[1])}</h4>`); }
      else if ((match = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)/))) {
        flush();
        const type = /\d/.test(match[1]) ? 'ol' : 'ul';
        if (list !== type) { endList(); out.push(`<${type}>`); list = type; }
        out.push(`<li>${inlineMd(match[2])}</li>`);
      } else { endList(); para.push(line); }
    }
    flush();
    endList();
    return out.join('');
  }).join('');
}

function emptyState(engine) {
  const info = ENGINES[engine];
  const available = ai.status[engine]?.available !== false;
  const el = document.createElement('div');
  el.className = 'empty';
  el.innerHTML = `<div class="mark" style="background:${info.color}">${icon('spark')}</div>`
    + `<h3>${info.label}와 함께 브라우징</h3>`
    + (available
      ? `<p>보고 있는 페이지를 읽고, 새 탭을 열어 조사하고, 클릭과 입력까지 대신합니다. 구독 중인 ${info.label} 계정을 그대로 사용합니다.</p>`
        + `<div class="sugs">${SUGGESTIONS.map(text => `<button>${escapeHtml(text)}</button>`).join('')}</div>`
      : `<p>${info.label} CLI를 찾을 수 없습니다.<br>설치한 뒤 터미널에서 <code>${engine === 'claude' ? 'claude' : 'codex login'}</code>으로 로그인하세요.</p>`);
  el.querySelectorAll('.sugs button').forEach(button => button.addEventListener('click', () => sendPrompt(button.textContent)));
  return el;
}
function resetLog(engine) {
  const log = logOf(engine);
  log.replaceChildren(emptyState(engine));
  ai.streaming[engine] = null;
  ai.tools[engine].clear();
}

function append(engine, el) {
  const log = logOf(engine);
  log.querySelector('.empty')?.remove();
  const typing = log.querySelector('.typing');
  log.insertBefore(el, typing);
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 140;
  if (nearBottom || el.classList.contains('me')) log.scrollTop = log.scrollHeight;
  return el;
}
function stickToBottom(engine) {
  const log = logOf(engine);
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 200) log.scrollTop = log.scrollHeight;
}

function setTyping(engine, on) {
  const log = logOf(engine);
  let typing = log.querySelector('.typing');
  if (on && !typing) {
    typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<i></i><i></i><i></i>';
    log.append(typing);
    log.scrollTop = log.scrollHeight;
  } else if (!on) typing?.remove();
}

function toolView(name, detail) {
  if (/agent\.mjs/.test(detail)) return { icon: 'globe', label: '브라우저 조작', detail: detail.replace(/^.*?agent\.mjs["']?\s*/, '').replace(/--keep-tabs\s*/, '') || 'script', browser: true };
  if (name === 'Write' || name === 'Edit') return { icon: 'file', label: '스크립트 작성', detail: detail.split(/[\\/]/).pop() };
  if (name === 'WebSearch') return { icon: 'search', label: '웹 검색', detail };
  if (name === 'WebFetch') return { icon: 'globe', label: '웹 페이지 읽기', detail };
  if (name === 'Read') return { icon: 'file', label: '파일 읽기', detail: detail.split(/[\\/]/).pop() };
  if (name === 'Bash' || name === 'Shell') return { icon: 'terminal', label: '명령 실행', detail };
  return { icon: 'terminal', label: name || '도구', detail };
}

function handleAi(engine, event) {
  const streaming = ai.streaming[engine];
  switch (event.kind) {
    case 'user': {
      const el = document.createElement('div');
      el.className = 'msg me';
      el.textContent = event.text;
      append(engine, el);
      break;
    }
    case 'delta': {
      let msg = streaming;
      if (!msg) {
        msg = append(engine, document.createElement('div'));
        msg.className = 'msg ai streaming';
        msg.raw = '';
        ai.streaming[engine] = msg;
      }
      msg.raw += event.text ?? '';
      if (!msg.pending) {
        msg.pending = true;
        setTimeout(() => { msg.pending = false; if (!msg.isConnected || !msg.classList.contains('streaming')) return; msg.innerHTML = markdown(msg.raw); stickToBottom(engine); }, 50);
      }
      break;
    }
    case 'text': {
      if (!event.text?.trim()) break;
      const msg = streaming ?? append(engine, document.createElement('div'));
      msg.className = 'msg ai';
      msg.raw = event.text;
      msg.innerHTML = markdown(event.text);
      ai.streaming[engine] = null;
      stickToBottom(engine);
      break;
    }
    case 'tool': {
      if (streaming) { streaming.innerHTML = markdown(streaming.raw); streaming.classList.remove('streaming'); ai.streaming[engine] = null; }
      const view = toolView(event.name, event.detail ?? '');
      const el = document.createElement('div');
      el.className = `tool run${view.browser ? ' browser' : ''}`;
      el.innerHTML = `<div class="row"><span class="ti">${icon(view.icon)}</span><span class="tl">${escapeHtml(view.label)}</span>`
        + `<span class="td">${escapeHtml(view.detail)}</span><span class="ts"></span></div><pre hidden></pre>`;
      el.title = event.detail ?? '';
      el.body = event.body || '';
      el.querySelector('.row').addEventListener('click', () => {
        const pre = el.querySelector('pre');
        pre.textContent = [el.body, el.output].filter(Boolean).join('\n\n── 결과 ──\n') || '(출력 없음)';
        pre.hidden = !pre.hidden;
      });
      ai.tools[engine].set(event.id, el);
      append(engine, el);
      break;
    }
    case 'toolDone': {
      const el = ai.tools[engine].get(event.id);
      if (!el) break;
      el.classList.remove('run');
      el.classList.add(event.ok ? 'ok' : 'fail');
      el.querySelector('.ts').innerHTML = icon(event.ok ? 'check' : 'x');
      el.output = event.output || '';
      break;
    }
    case 'thinking': {
      if (!event.text?.trim()) break;
      const el = document.createElement('div');
      el.className = 'think';
      el.textContent = event.text.replace(/\*\*/g, '');
      append(engine, el);
      break;
    }
    case 'note':
    case 'error': {
      const el = document.createElement('div');
      el.className = `note${event.kind === 'error' ? ' err' : ''}`;
      el.textContent = event.text;
      append(engine, el);
      break;
    }
    case 'usage':
      ai.usage = event;
      renderUsage();
      break;
    case 'done':
      if (streaming) { streaming.innerHTML = markdown(streaming.raw); streaming.classList.remove('streaming'); ai.streaming[engine] = null; }
      for (const el of ai.tools[engine].values()) if (el.classList.contains('run')) { el.classList.remove('run'); el.querySelector('.ts').innerHTML = ''; }
      if (event.error) handleAi(engine, { kind: 'error', text: event.error });
      break;
  }
}

function renderUsage() {
  const el = $('.usage');
  const usage = ai.usage;
  if (el.usage === usage && el.engine === ai.engine) return;
  el.usage = usage; el.engine = ai.engine;
  el.hidden = ai.engine !== 'claude' || !usage || (usage.five == null && usage.week == null);
  if (el.hidden) return;
  const bar = (label, value) => value == null ? '' : `<span>${label}<i><b class="${value > .8 ? 'hot' : ''}" style="width:${Math.round(value * 100)}%"></b></i>${Math.round(value * 100)}%</span>`;
  el.innerHTML = bar('5시간', usage.five) + bar('주간', usage.week);
}

function renderAiChrome() {
  const history = ai.history[ai.engine];
  const select = $('#aiHistory');
  if (select.history !== history) {
  select.history = history;
  select.replaceChildren(...(history?.chats ?? []).map(chat => {
    const option = document.createElement('option');
    option.value = chat.id; option.textContent = chat.title;
    option.selected = chat.id === history.selected;
    return option;
  }));
  }
  select.disabled = !!ai.status[ai.engine]?.running;

  const segs = [...document.querySelectorAll('.seg button')];
  for (const button of segs) {
    const engine = button.dataset.engine;
    button.classList.toggle('on', engine === ai.engine);
    button.classList.toggle('running', !!ai.status[engine]?.running);
  }
  const active = segs.find(button => button.classList.contains('on'));
  const thumb = $('.seg .thumb');
  if (thumb.dataset.engine !== ai.engine) {
    thumb.dataset.engine = ai.engine;
    thumb.style.width = `${active.offsetWidth}px`;
    thumb.style.transform = `translateX(${active.offsetLeft}px)`;
  }
  document.querySelectorAll('.log').forEach(log => { log.hidden = log.dataset.engine !== ai.engine; });
  const running = !!ai.status[ai.engine]?.running;
  aiSend.classList.toggle('stop', running);
  if (aiSend.dataset.running !== String(running)) {
    aiSend.dataset.running = String(running);
    aiSend.innerHTML = icon(running ? 'stop' : 'send');
  }
  aiSend.title = running ? '중지' : '보내기 (Enter)';
  aiSend.disabled = !running && (!aiInput.value.trim() || ai.status[ai.engine]?.available === false);
  aiInput.placeholder = `${ENGINES[ai.engine].label}에게 요청하기…`;
  $('#assistBtn').classList.toggle('on', document.body.classList.contains('assist'));
  renderUsage();
  renderContext();
}
function renderContext() {
  const tab = state.tabs.find(item => item.id === state.active);
  const chip = $('#aiCtx');
  chip.classList.toggle('on', ai.context);
  chip.querySelector('span').textContent = tab ? tabTitle(tab) : '현재 탭 없음';
}

function sendPrompt(text) {
  text = text.trim();
  if (!text || ai.status[ai.engine]?.running) return;
  const tab = state.tabs.find(item => item.id === state.active);
  const el = document.createElement('div');
  el.className = 'msg me';
  el.innerHTML = (ai.context && tab ? `<span class="ctx-ref">↳ ${escapeHtml(tabTitle(tab))}</span>` : '') + escapeHtml(text);
  append(ai.engine, el);
  ai.status[ai.engine] = { ...ai.status[ai.engine], running: true };
  setTyping(ai.engine, true);
  send('ai.send', { engine: ai.engine, text, context: ai.context });
  aiInput.value = '';
  autosize();
  renderAiChrome();
}

function autosize() {
  aiInput.style.height = 'auto';
  aiInput.style.height = `${Math.min(aiInput.scrollHeight, 160)}px`;
}

function toggleAssist(open = !document.body.classList.contains('assist')) {
  document.body.classList.toggle('assist', open);
  followLayout(450);
  renderAiChrome();
  if (open) { send('ai.focus'); setTimeout(() => aiInput.focus(), 60); }

for (const engine of Object.keys(ENGINES)) resetLog(engine);
document.querySelectorAll('.seg button').forEach(button => button.addEventListener('click', () => {
  ai.engine = button.dataset.engine;
  renderAiChrome();
  aiInput.focus();
}));
aiInput.addEventListener('input', () => { autosize(); renderAiChrome(); });
aiInput.addEventListener('keydown', event => {

});

  if (ai.status[ai.engine]?.running) send('ai.stop', { engine: ai.engine });
  else sendPrompt(aiInput.value);
});
$('#aiCtx').addEventListener('click', () => { ai.context = !ai.context; renderContext(); });
$('#aiReset').addEventListener('click', () => {
  send('ai.reset', { engine: ai.engine });
  aiInput.focus();
});
$('#aiFollow').addEventListener('change', event => send('ai.follow', { enabled: event.target.checked }));
$('#aiHistory').addEventListener('change', event => send('ai.select', { engine: ai.engine, id: event.target.value }));
$('#aiClose').addEventListener('click', () => toggleAssist(false));
renderAiChrome();
$('#assistBtn').addEventListener('click', () => toggleAssist());
$('#assist').addEventListener('click', event => {

/* ---------- Host wiring ---------- */

let sidebarRequested = null;
let sidebarMotion = false;
let sidebarEndTimer;
$('#toggle').addEventListener('click', () => {
  sidebarRequested = !(sidebarRequested ?? state.collapsed);
  send('collapse', { collapsed: sidebarRequested });
});
$('#back').addEventListener('click', () => send('back'));
$('#forward').addEventListener('click', () => send('forward'));
$('#reload').addEventListener('click', () => send('reload'));
$('#urlbar').addEventListener('click', () => send('palette', { mode: 'current' }));
$('#newtab').addEventListener('click', () => send('palette', { mode: 'new' }));
$('#tabSearch').addEventListener('click', () => send('palette', { mode: 'tabs' }));
tabsEl.addEventListener('scroll', () => { lastIndicator = ''; placeIndicator(); });

const viewport = $('#viewport');
let lastLayout = '';
function reportLayout() {
  if (sidebarMotion) return;
  const r = viewport.getBoundingClientRect();
  const d = window.devicePixelRatio;
  const layout = { x: Math.round(r.left * d), y: Math.round(r.top * d), w: Math.round(r.width * d), h: Math.round(r.height * d), r: Math.round(10 * d) };
  const key = JSON.stringify(layout);
  if (key !== lastLayout) { lastLayout = key; send('layout', layout); }
}
let layoutUntil = 0;
function followLayout(ms) {
  const running = performance.now() < layoutUntil;
  layoutUntil = Math.max(layoutUntil, performance.now() + ms);
  if (running) return;
  const loop = () => { reportLayout(); if (performance.now() < layoutUntil) requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
new ResizeObserver(reportLayout).observe(viewport);
$('#sidebar').addEventListener('transitionrun', event => { if (event.propertyName === 'width') followLayout(400); });

function finishSidebarMotion() {
  if (!sidebarMotion) return;
  clearTimeout(sidebarEndTimer);
  const r = viewport.getBoundingClientRect(), d = devicePixelRatio;
  send('sidebar.done', { x: Math.round(r.left*d), y: Math.round(r.top*d), w: Math.round(r.width*d), h: Math.round(r.height*d), r: Math.round(10*d) });
}
$('#sidebar').addEventListener('transitionend', event => {
  if (event.propertyName === 'width') finishSidebarMotion();
});

const darkQuery = matchMedia('(prefers-color-scheme: dark)');
function reportTheme() {
  const css = getComputedStyle(document.documentElement);
  send('theme', { canvas: css.getPropertyValue('--canvas').trim(), ink: css.getPropertyValue('--ink').trim(), dark: darkQuery.matches });
}
darkQuery.addEventListener('change', reportTheme);
matchMedia(`(resolution: ${devicePixelRatio}dppx)`).addEventListener('change', () => { lastLayout = ''; reportLayout(); });

webview?.addEventListener('message', event => {
  const message = event.data;
  if (message.type === 'sidebar.prepare') {
    const shot = $('#sidebar-shot');
    shot.src = message.shot;
    shot.decode().then(() => { shot.hidden = false; send('sidebar.ready'); }, () => send('sidebar.ready'));
  } else if (message.type === 'sidebar.animate' || message.type === 'sidebar.instant') {
    sidebarMotion = message.type === 'sidebar.animate';
    document.body.classList.toggle('sidebar-instant', !sidebarMotion);
    state.collapsed = message.collapsed;
    render();
    clearTimeout(sidebarEndTimer);
    if (sidebarMotion) sidebarEndTimer = setTimeout(finishSidebarMotion, 250);
    else { sidebarRequested = null; reportLayout(); requestAnimationFrame(() => document.body.classList.remove('sidebar-instant')); }
  } else if (message.type === 'sidebar.restored') {
    sidebarMotion = false;
    sidebarRequested = null;
    $('#sidebar-shot').hidden = true;
    $('#sidebar-shot').removeAttribute('src');
    lastLayout = '';
    reportLayout();
  } else if (message.type === 'state') {
    const collapsedChanged = message.collapsed !== state.collapsed;
    state = message;
    render();
    if (collapsedChanged) followLayout(400);
  } else if (message.type === 'ai.history') {
    ai.history[message.engine] = message; renderAiChrome();
  } else if (message.type === 'ai.restore') {
    resetLog(message.engine);
    for (const item of message.events) handleAi(message.engine, item);
    handleAi(message.engine, { kind: 'done' });
  } else if (message.type === 'ai.historyError') {
    handleAi(ai.engine, { kind: 'error', text: message.text });
  } else if (message.type === 'activity') {
    const el = $('#aiActivity');
    el.hidden = !message.running;
    el.textContent = message.running ? `◉ ${message.label}` : '';
  } else if (message.type === 'ai') handleAi(message.engine, message.event);
  else if (message.type === 'ai.status') {
    for (const [engine, status] of Object.entries(message.engines)) {
      const wasAvailable = ai.status[engine]?.available;
      ai.status[engine] = status;
      if (!status.running) setTyping(engine, false);
      if (wasAvailable !== status.available && logOf(engine).querySelector('.empty')) resetLog(engine);
    }
    renderAiChrome();
  } else if (message.type === 'assist') toggleAssist();
  else if (message.type === 'palette') openPalette(message);
  else if (message.type === 'focus') { query.focus(); }
  else if (message.type === 'closePalette') closePalette();
});

document.addEventListener('contextmenu', event => event.preventDefault());

// Browser accelerator keys are off in this page, so app shortcuts are forwarded to the host explicitly.
document.addEventListener('keydown', event => {
  const { ctrlKey: ctrl, shiftKey: shift, altKey: alt, code } = event;
  const key = /^Key[A-Z]$/.test(code) ? code.slice(3)
    : /^Digit[1-9]$/.test(code) ? `D${code.slice(5)}`
    : { Tab: 'Tab', F5: 'F5', ArrowLeft: 'Left', ArrowRight: 'Right' }[code];
  if (!key) return;
  const typing = event.target.matches?.('input, textarea');
  const wanted = (ctrl && !alt && (/^[TKLWJRS]$/.test(key) || key === 'Tab' || /^D[1-9]$/.test(key)))
    || (key === 'F5' && !ctrl && !alt)
    || (alt && !ctrl && (key === 'Left' || key === 'Right') && !typing);
  if (!wanted) return;
  event.preventDefault();
  send('shortcut', { key, ctrl, shift, alt });
});
reportTheme();
reportLayout();
send('ready');
</script>
</body>
</html>
